<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 430" font-family="DM Sans, Helvetica, Arial, sans-serif">
  <!-- Kaira closed-loop architecture, brand-styled for the pitch deck.
       Signal path in Neural Blue, decision path in Deep Slate, the
       adaptation loop in Adaptive Green: sense -> understand -> adapt. -->
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#489fce"/>
    </marker>
    <marker id="slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#263238"/>
    </marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#87cc9a"/>
    </marker>
  </defs>
  
  <!-- boxes -->
  <g stroke="#263238" stroke-width="1.5" fill="none">
    <rect x="30"   y="120" width="190" height="96" rx="14"/>
    <rect x="272"  y="120" width="190" height="96" rx="14"/>
    <rect x="514"  y="120" width="190" height="96" rx="14"/>
    <rect x="756"  y="120" width="190" height="96" rx="14"/>
    <rect x="998"  y="120" width="190" height="96" rx="14"/>
    <rect x="1240" y="120" width="170" height="96" rx="14"/>
  </g>

  <!-- box titles + subtitles -->
  <g fill="#263238" font-size="16" font-weight="600" text-anchor="middle">
    <text x="125"  y="158">Patient</text>
    <text x="367"  y="158">eego amplifier</text>
    <text x="609"  y="158">Acquire &amp; clean</text>
    <text x="851"  y="158">Cognitive load</text>
    <text x="1093" y="158">Decide</text>
    <text x="1325" y="158">Clinician</text>
  </g>
  <g fill="#56636b" font-size="12" text-anchor="middle">
    <text x="125" y="180">EEG cap on,</text>
    <text x="125" y="197">answering questions</text>
    <text x="367" y="180">64-channel EEG</text>
    <text x="367" y="197">512 samples / s</text>
    <text x="609" y="180">live 2 s windows</text>
    <text x="609" y="197">artifacts out, trust flag</text>
    <text x="851" y="180">Welch spectrum</text>
    <text x="851" y="197">ln(frontal &#952; / parietal &#945;)</text>
    <text x="1093" y="180">answer sets the direction,</text>
    <text x="1093" y="197">the EEG can veto it</text>
    <text x="1325" y="180">scores the answer,</text>
    <text x="1325" y="197">reads the next task</text>
  </g>

  <!-- signal path (blue), decision path (slate) -->
  <g stroke-width="2" fill="none">
    <line x1="220" y1="168" x2="264" y2="168" stroke="#489fce" marker-end="url(#blue)"/>
    <line x1="462" y1="168" x2="506" y2="168" stroke="#489fce" marker-end="url(#blue)"/>
    <line x1="704" y1="168" x2="748" y2="168" stroke="#489fce" marker-end="url(#blue)"/>
    <line x1="946" y1="168" x2="990" y2="168" stroke="#263238" marker-end="url(#slate)"/>
    <line x1="1188" y1="168" x2="1232" y2="168" stroke="#263238" marker-end="url(#slate)"/>
  </g>

  <!-- baseline note under the load box -->
  <text x="851" y="248" fill="#8a949b" font-size="11.5" text-anchor="middle">measured against this patient's own resting baseline (90 s to 3 min, stops when settled)</text>

  <!-- adaptation loop (green): clinician back to patient -->
  <path d="M1325 216 L1325 330 Q1325 350 1305 350 L145 350 Q125 350 125 330 L125 224" stroke="#87cc9a" stroke-width="2.5" fill="none" marker-end="url(#green)"/>
  <text x="725" y="338" fill="#3f9e63" font-size="13" font-weight="600" text-anchor="middle">next question: harder, easier, hold, or repeat - decided live, before the patient notices a pause</text>

  <!-- answer joins the decision -->
  <path d="M1325 120 Q1325 60 1113 60 L1113 112" stroke="#263238" stroke-width="1.5" fill="none" stroke-dasharray="4 4" marker-end="url(#slate)"/>
  <text x="1218" y="48" fill="#56636b" font-size="12" text-anchor="middle">right / wrong answer</text>
</svg>
